<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Cotorreo Rewards</title>

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#6b21a8" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Rewards" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png" />

  <style>
    :root {
      --violet-deep: #3b0764;
      --violet: #6b21a8;
      --violet-vivid: #7c3aed;
      --amber: #f59e0b;
      --amber-soft: #fde68a;
      --amber-deep: #b45309;
      --teal: #0d9488;
      --teal-soft: #99f6e4;
      --teal-vivid: #14b8a6;
      --cream: #faf7f4;
      --cream-warm: #f4efe8;
      --sand: #e6dfd5;
      --stone: #8f8577;
      --ink: #1e1435;
      --ink-soft: #5a4d70;
      --line: #d9d0c1;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --cream: #14101a; --cream-warm: #1a1524; --sand: #24202e;
        --stone: #6b6672; --ink: #f4efe8; --ink-soft: #b8b0c4; --line: #2a2536;
      }
    }
    :root[data-theme="light"] { --cream:#faf7f4; --cream-warm:#f4efe8; --sand:#e6dfd5; --stone:#8f8577; --ink:#1e1435; --ink-soft:#5a4d70; --line:#d9d0c1; }
    :root[data-theme="dark"] { --cream:#14101a; --cream-warm:#1a1524; --sand:#24202e; --stone:#6b6672; --ink:#f4efe8; --ink-soft:#b8b0c4; --line:#2a2536; }

    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--cream); color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", sans-serif;
      font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased;
    }
    .device {
      max-width: 480px; margin: 0 auto; background: var(--cream);
      min-height: 100vh; position: relative;
      box-shadow: 0 0 60px rgba(0,0,0,0.05);
      overflow-x: hidden;
    }
    body { overflow-x: hidden; }
    @media (display-mode: standalone) {
      body { padding-top: env(safe-area-inset-top); }
    }

    /* ============ TOP NAV ============ */
    .top-nav {
      position: sticky; top: 0; z-index: 40;
      padding: 14px 20px 12px;
      background: color-mix(in srgb, var(--cream) 92%, transparent);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--line);
      display: flex; align-items: center; justify-content: space-between;
    }
    .brand-block { display: flex; align-items: center; gap: 10px; }
    .grupo-mark {
      width: 40px; height: 40px; border-radius: 12px;
      background: linear-gradient(135deg, var(--violet) 0%, var(--violet-deep) 100%);
      display: grid; place-items: center;
      box-shadow: 0 2px 8px -2px rgba(107, 33, 168, 0.4);
    }
    .grupo-mark img { width: 26px; height: 26px; filter: brightness(0) invert(1); }
    .brand-text { line-height: 1; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--stone); }
    .brand-text b {
      display: block; font-family: Georgia, serif; font-size: 18px;
      letter-spacing: -0.01em; color: var(--ink);
      text-transform: none; font-weight: 400; margin-top: 3px;
    }
    .avatar {
      width: 40px; height: 40px; border-radius: 50%;
      background: var(--teal); color: white;
      display: grid; place-items: center;
      font-family: Georgia, serif; font-size: 17px;
      box-shadow: 0 2px 8px -2px rgba(13, 148, 136, 0.4);
    }

    /* ============ HERO ============ */
    .hero {
      position: relative; margin: 16px 20px 0;
      padding: 24px 22px 26px;
      border-radius: 20px; overflow: hidden; color: white;
      background: linear-gradient(135deg, var(--violet-deep) 0%, var(--violet) 60%, var(--violet-vivid) 100%);
      box-shadow: 0 12px 32px -12px rgba(59, 7, 100, 0.5);
    }
    .hero::before {
      content: ''; position: absolute; inset: 0;
      background-image: url("/assets/hero-local.jpg");
      background-size: cover; background-position: center;
      opacity: 0.12; mix-blend-mode: overlay;
    }
    .hero::after {
      content: ''; position: absolute;
      top: -60px; right: -60px;
      width: 200px; height: 200px; border-radius: 50%;
      background: var(--teal-vivid); opacity: 0.15;
      filter: blur(40px);
    }
    .hero-content { position: relative; z-index: 1; }
    .greeting { font-size: 13px; opacity: 0.85; }
    .greeting b { font-weight: 500; }
    .card-numbers { display: flex; align-items: baseline; gap: 6px; margin-top: 14px; }
    .big-n {
      font-family: Georgia, serif; font-size: 68px;
      line-height: 0.9; letter-spacing: -0.04em;
    }
    .of-n { font-size: 15px; opacity: 0.75; margin-left: 4px; }

    /* Grid 5x4 de sellos con logo Grupo Cotorreo */
    .sellos-grid {
      display: grid; grid-template-columns: repeat(5, 1fr);
      gap: 8px 6px; margin-top: 18px;
      padding: 0 4px;
    }
    .sello {
      aspect-ratio: 1;
      border-radius: 50%;
      display: grid; place-items: center;
      transition: transform 0.15s;
    }
    .sello.on {
      background: white;
      box-shadow: 0 2px 6px -1px rgba(0,0,0,0.2), 0 0 0 2px var(--teal-vivid);
    }
    .sello.off {
      background: transparent;
      border: 1.5px dashed rgba(255,255,255,0.35);
    }
    .sello img {
      width: 66%; height: 66%;
      object-fit: contain;
    }
    .sello.on img { filter: none; }
    .sello.off img {
      filter: brightness(0) invert(1);
      opacity: 0.25;
    }

    .card-meta {
      display: flex; justify-content: space-between; align-items: center;
      margin-top: 16px; font-size: 12px; opacity: 0.85;
    }
    .card-meta .id {
      font-family: "SF Mono", "Cascadia Code", monospace;
      letter-spacing: 0.05em; padding: 3px 8px;
      background: rgba(255,255,255,0.1);
      border-radius: 6px; font-size: 11px;
    }

    /* ============ SECCION TITULO ============ */
    .section-title {
      padding: 28px 20px 12px;
      display: flex; justify-content: space-between; align-items: baseline;
    }
    .section-title h2 {
      font-family: Georgia, serif; font-weight: 400; margin: 0;
      font-size: 21px; letter-spacing: -0.01em;
    }
    .section-title .link {
      font-size: 11px; text-transform: uppercase;
      letter-spacing: 0.14em; color: var(--violet);
      text-decoration: none; font-weight: 600;
    }

    /* ============ NEGOCIOS GRID ============ */
    .negocios {
      padding: 0 20px; display: grid;
      grid-template-columns: repeat(3, 1fr); gap: 10px;
    }
    .negocio-card {
      aspect-ratio: 1; background: var(--cream-warm);
      border: 1px solid var(--line); border-radius: 14px;
      display: grid; place-items: center; padding: 12px;
      cursor: pointer; transition: all 0.2s;
    }
    .negocio-card:hover, .negocio-card:active {
      border-color: var(--teal); transform: translateY(-2px);
      box-shadow: 0 6px 16px -6px rgba(13, 148, 136, 0.25);
    }
    .negocio-card img { max-width: 88%; max-height: 88%; object-fit: contain; }

    /* ============ MENU COMPLETO ============ */
    .menu-completo-wrap { padding: 0 20px 8px; }
    .menu-completo-card {
      background: var(--cream-warm);
      border: 1px solid var(--line); border-radius: 16px;
      overflow: hidden; cursor: pointer;
      transition: all 0.2s;
    }
    .menu-completo-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px -8px rgba(30,20,53,0.2); }
    .menu-completo-hero {
      aspect-ratio: 16/9;
      background-image: url("/assets/menu-p1.jpg");
      background-size: cover; background-position: center;
      position: relative;
    }
    .menu-completo-hero::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(to bottom, transparent 40%, rgba(30,20,53,0.7) 100%);
    }
    .menu-completo-info {
      position: absolute; bottom: 12px; left: 14px; right: 14px;
      color: white; z-index: 1;
      display: flex; justify-content: space-between; align-items: flex-end;
    }
    .menu-completo-info h3 { font-family: Georgia, serif; font-weight: 400; margin: 0; font-size: 20px; letter-spacing: -0.01em; }
    .menu-completo-info .sub { font-size: 11px; opacity: 0.85; text-transform: uppercase; letter-spacing: 0.12em; margin-top: 3px; }
    .menu-completo-info .btn {
      background: white; color: var(--violet);
      padding: 6px 12px; border-radius: 999px;
      font-size: 11px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.1em;
    }
    .menu-completo-pages {
      display: flex; gap: 10px; padding: 12px;
      overflow-x: scroll; scroll-snap-type: x mandatory;
      scrollbar-width: none; -webkit-overflow-scrolling: touch;
    }
    .menu-completo-pages::-webkit-scrollbar { display: none; }
    .menu-page {
      flex: 0 0 92% !important;
      width: 92%;
      scroll-snap-align: center;
      aspect-ratio: 1600/1063;
      background-size: cover; background-position: center;
      border-radius: 10px;
      box-shadow: 0 4px 12px -3px rgba(0,0,0,0.15);
    }

    /* ============ MENU CAROUSEL populares ============ */
    .menu-scroll-wrap {
      position: relative;
    }
    .menu-scroll {
      display: flex; gap: 12px; padding: 4px 20px 12px;
      overflow-x: scroll; scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      scroll-padding-left: 20px;
    }
    .menu-scroll::-webkit-scrollbar { display: none; }
    /* Peek: agregar padding-right para que se vea que hay mas items */
    .menu-scroll::after {
      content: ''; flex: 0 0 8px;
    }
    .menu-card {
      flex: 0 0 200px !important;
      width: 200px;
      scroll-snap-align: start;
      background: var(--cream-warm); border-radius: 16px;
      overflow: hidden; border: 1px solid var(--line);
      box-shadow: 0 4px 14px -4px rgba(30,20,53,0.12);
      transition: all 0.2s; cursor: pointer;
    }
    .menu-card:hover { transform: translateY(-3px); box-shadow: 0 8px 24px -8px rgba(30,20,53,0.2); }
    .menu-card .img { aspect-ratio: 4/3; background-size: cover; background-position: center; }
    .menu-card .body { padding: 12px 14px; }
    .menu-card h3 { font-family: Georgia, serif; font-weight: 400; margin: 0; font-size: 15px; }
    .menu-card .meta { display: flex; justify-content: space-between; align-items: baseline; margin-top: 6px; font-size: 11px; color: var(--ink-soft); }
    .menu-card .meta .p { color: var(--violet); font-family: Georgia, serif; font-size: 15px; font-weight: 500; }
    .menu-card .tag {
      display: inline-block; margin-top: 4px;
      padding: 2px 8px; background: var(--teal-soft); color: var(--teal);
      font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em;
      font-weight: 600; border-radius: 999px;
    }

    /* ============ CANJE ============ */
    .canje-card {
      margin: 4px 20px 20px; padding: 22px;
      background: radial-gradient(circle at top right, rgba(180, 83, 9, 0.12), transparent 60%), linear-gradient(135deg, #fef3c7 0%, #fbbf24 100%);
      border-radius: 20px; position: relative; overflow: hidden;
      box-shadow: 0 8px 28px -8px rgba(245, 158, 11, 0.45);
    }
    .canje-card::before {
      content: '🎁'; position: absolute; top: -30px; right: -20px;
      font-size: 130px; opacity: 0.15; transform: rotate(-15deg);
    }
    .canje-card .content { position: relative; z-index: 1; }
    .canje-card .lbl { font-size: 10px; text-transform: uppercase; letter-spacing: 0.16em; color: #78350f; font-weight: 700; }
    .canje-card .amt { font-family: Georgia, serif; font-size: 40px; letter-spacing: -0.03em; color: #451a03; line-height: 1; margin-top: 8px; }
    .canje-card p { margin: 10px 0 16px; font-size: 13px; color: #78350f; max-width: 260px; line-height: 1.45; }
    .canje-card button {
      background: #1e1435; color: white;
      border: none; border-radius: 999px; padding: 12px 24px;
      font-size: 13px; font-weight: 600; letter-spacing: 0.02em;
      cursor: pointer; font-family: inherit;
      box-shadow: 0 4px 12px -2px rgba(30, 20, 53, 0.3);
    }
    .canje-card.locked {
      background: var(--cream-warm);
      box-shadow: 0 4px 14px -4px rgba(0,0,0,0.06);
    }
    .canje-card.locked::before { display: none; }
    .canje-card.locked .amt { color: var(--stone); }
    .canje-card.locked .lbl { color: var(--stone); }
    .canje-card.locked p { color: var(--ink-soft); }
    .canje-card.locked button { background: var(--stone); cursor: not-allowed; }

    /* ============ ACTIVITY ============ */
    .activity { padding: 0 20px 12px; }
    .activity-item {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 0; border-bottom: 1px solid var(--line);
    }
    .activity-item:last-child { border-bottom: none; }
    .activity-item .ico {
      width: 42px; height: 42px; border-radius: 12px;
      display: grid; place-items: center; font-size: 20px;
      background: var(--sand);
    }
    .activity-item .body { flex: 1; min-width: 0; }
    .activity-item .body h4 { margin: 0; font-size: 14px; font-weight: 500; }
    .activity-item .body .sub { font-size: 12px; color: var(--stone); margin-top: 2px; }
    .activity-item .amt { font-family: Georgia, serif; color: var(--teal); font-weight: 600; font-size: 16px; }
    .empty-state {
      padding: 24px; text-align: center; color: var(--stone); font-size: 13px;
    }

    /* ============ BOTTOM NAV ============ */
    .bottom-nav {
      position: sticky; bottom: 0; background: var(--cream);
      border-top: 1px solid var(--line);
      display: grid; grid-template-columns: repeat(4, 1fr);
      padding: 8px 0 max(8px, env(safe-area-inset-bottom));
      z-index: 30;
    }
    .nav-item {
      display: grid; place-items: center; gap: 2px; padding: 8px 0;
      cursor: pointer; color: var(--stone);
      font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em;
    }
    .nav-item.active { color: var(--violet); }
    .nav-item svg { width: 22px; height: 22px; fill: currentColor; }

    /* Login / Registro screens */
    .center-card {
      max-width: 400px; margin: 40px auto;
      background: var(--cream-warm);
      border: 1px solid var(--line);
      border-radius: 20px; padding: 28px 24px;
    }
    .center-card h2 { font-family: Georgia, serif; font-weight: 400; font-size: 24px; margin: 0 0 4px; letter-spacing: -0.01em; }
    .center-card p { color: var(--ink-soft); font-size: 14px; margin: 4px 0 20px; }
    .center-card input {
      width: 100%; padding: 14px 16px;
      border: 1.5px solid var(--line); border-radius: 12px;
      background: var(--cream); color: var(--ink);
      font-size: 16px; font-family: inherit;
      margin-bottom: 12px;
      transition: border-color 0.15s;
    }
    .center-card input:focus { outline: none; border-color: var(--violet); }
    .center-card label { font-size: 11px; color: var(--stone); text-transform: uppercase; letter-spacing: 0.14em; font-weight: 600; display: block; margin-bottom: 4px; }
    .center-card button {
      width: 100%; padding: 14px;
      background: linear-gradient(135deg, var(--violet) 0%, var(--violet-deep) 100%);
      color: white; border: none; border-radius: 12px;
      font-size: 15px; font-weight: 600; letter-spacing: 0.02em;
      cursor: pointer; font-family: inherit;
      box-shadow: 0 4px 14px -2px rgba(107, 33, 168, 0.4);
      transition: transform 0.15s;
    }
    .center-card button:hover { transform: translateY(-1px); }
    .center-card .hint { text-align: center; color: var(--stone); font-size: 12px; margin-top: 16px; }

    /* Loading */
    .loading {
      display: grid; place-items: center;
      padding: 80px 20px; gap: 16px;
    }
    .spinner {
      width: 32px; height: 32px; border-radius: 50%;
      border: 3px solid var(--sand); border-top-color: var(--violet);
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    const app = document.getElementById('app');
    let miembro = null;

    // === API ===
    async function api(path, opts) {
      const r = await fetch(path, opts);
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || `HTTP ${r.status}`);
      return data;
    }

    // === Router ===
    async function init() {
      const params = new URLSearchParams(location.search);
      const tel = params.get('t');
      if (tel) {
        try {
          const data = await api(`/api/get-mis-sellos?telefono=${encodeURIComponent(tel)}`);
          if (data.ok) {
            miembro = data;
            renderDashboard();
            return;
          }
        } catch (e) {
          if (String(e.message).includes("no encontrado")) {
            renderRegistro(tel);
            return;
          }
          renderError(e.message);
          return;
        }
      }
      renderLogin();
    }

    function renderLoading() {
      app.innerHTML = `<div class="loading"><div class="spinner"></div><div style="color:var(--stone);font-size:13px">Cargando…</div></div>`;
    }

    function renderLogin() {
      app.innerHTML = `
        <div class="center-card">
          <h2>¡Hola! 👋</h2>
          <p>Ingresá tu teléfono WhatsApp para ver tus sellos.</p>
          <form onsubmit="handleLogin(event)">
            <label>Teléfono</label>
            <input id="tel" type="tel" required placeholder="8 dígitos (ej: 8888-8888)" autocomplete="tel" />
            <button type="submit">Continuar</button>
          </form>
          <div class="hint">Si no estás inscrito, te ayudamos a hacerlo en 30 segundos.</div>
        </div>
      `;
    }

    async function handleLogin(e) {
      e.preventDefault();
      const tel = document.getElementById('tel').value.replace(/\D/g, '');
      if (tel.length < 8) return alert("Teléfono inválido");
      location.href = `?t=${tel}`;
    }

    function renderRegistro(tel) {
      app.innerHTML = `
        <div class="center-card">
          <h2>✨ Sumate a Cotorreo Rewards</h2>
          <p>Ganás sellos por cada compra. 20 sellos = ₡15.000 de crédito.</p>
          <form onsubmit="handleRegistro(event, '${tel}')">
            <label>Nombre</label>
            <input id="nombre" type="text" required minlength="2" placeholder="Tu nombre" />
            <label>Email (opcional)</label>
            <input id="email" type="email" placeholder="tu@email.com" />
            <label>Cumpleaños (opcional)</label>
            <input id="cumple" type="date" />
            <button type="submit">Crear mi cuenta Rewards</button>
          </form>
        </div>
      `;
    }

    async function handleRegistro(e, tel) {
      e.preventDefault();
      const nombre = document.getElementById('nombre').value.trim();
      const email = document.getElementById('email').value.trim();
      const cumpleanos = document.getElementById('cumple').value;
      try {
        await api('/api/login-or-register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ telefono: tel, nombre, email, cumpleanos, origen: 'web' })
        });
        location.href = `?t=${tel}`;
      } catch (e) {
        alert("Error: " + e.message);
      }
    }

    function renderDashboard() {
      const m = miembro.miembro;
      const sellos = Math.min(m.sellos_actuales || 0, 20);
      const restantes = Math.max(0, 20 - sellos);
      const firstName = (m.nombre || 'amigo').split(' ')[0];
      const inicial = firstName.charAt(0).toUpperCase();
      const idCorto = m.id_corto || 'RW-XXXXX';

      // Grid 5x4 de sellos con logo Cotorreo
      let sellosHTML = '';
      for (let i = 0; i < 20; i++) {
        const on = i < sellos;
        sellosHTML += `<div class="sello ${on ? 'on' : 'off'}"><img src="/assets/logo-grupo-color.svg" alt="" /></div>`;
      }

      // Populares (menú)
      const platos = [
        { nombre: "Tacos al Pastor", negocio: "Tacos", precio: "₡4.000", tag: "Lunes 2x1", img: "/assets/plato-1.jpg" },
        { nombre: "Quesabirrias", negocio: "Taquería", precio: "₡5.000", tag: "Miércoles 2x1", img: "/assets/plato-2.jpg" },
        { nombre: "Bubble Tea Choco", negocio: "Bebidas", precio: "₡3.500", tag: null, img: "/assets/bebida.jpg" },
        { nombre: "Cancha de Pádel", negocio: "Alpadel", precio: "₡6.000/h", tag: null, img: "/assets/alpadel.jpg" },
      ];
      const platosHTML = platos.map(p => `
        <div class="menu-card">
          <div class="img" style="background-image:url(${p.img})"></div>
          <div class="body">
            <h3>${p.nombre}</h3>
            <div class="meta"><span>${p.negocio}</span><span class="p">${p.precio}</span></div>
            ${p.tag ? `<div class="tag">${p.tag}</div>` : ''}
          </div>
        </div>
      `).join('');

      // Actividad
      const txs = miembro.transacciones || [];
      const iconos = { plaza_cotorreo: '🌮', cotorreo_taqueria: '🍽️', alpadel: '🎾', bebros: '🎮', pits: '🍔', nube: '🏨' };
      const nombres = { plaza_cotorreo: 'Plaza Cotorreo', cotorreo_taqueria: 'Cotorreo Taquería', alpadel: 'Alpadel', bebros: 'Bebros', pits: 'Pits Burger', nube: 'Nube Suites' };
      const activityHTML = txs.length ? txs.slice(0, 5).map(t => `
        <div class="activity-item">
          <div class="ico">${iconos[t.negocio] || '🌟'}</div>
          <div class="body">
            <h4>${nombres[t.negocio] || t.negocio}</h4>
            <div class="sub">${t.fecha || 'Sin fecha'} · ₡${(t.monto || 0).toLocaleString('es-CR')}</div>
          </div>
          <div class="amt">+${t.sellos || 0}</div>
        </div>
      `).join('') : '<div class="empty-state">Aún no hay compras registradas.<br>Tu próxima compra te suma sellos automáticamente.</div>';

      // Canje card
      const canjeCard = m.canje_disponible
        ? `<div class="canje-card">
             <div class="content">
               <span class="lbl">Canje disponible</span>
               <div class="amt">₡15.000</div>
               <p>Tenés 20 sellos completos. Pedí tu código y mostralo al cajero en cualquier negocio del grupo.</p>
               <button onclick="pedirCanje()">🎁 Canjear ahora</button>
             </div>
           </div>`
        : `<div class="canje-card locked">
             <div class="content">
               <span class="lbl">Próximo canje</span>
               <div class="amt">₡15.000</div>
               <p>Completá ${restantes} sellos más para desbloquear tu crédito.</p>
             </div>
           </div>`;

      app.innerHTML = `
        <div class="device">
          <div class="top-nav">
            <div class="brand-block">
              <div class="grupo-mark"><img src="/assets/logo-grupo-blanco.svg" alt="Grupo Cotorreo" /></div>
              <div class="brand-text">Grupo Cotorreo<b>Rewards</b></div>
            </div>
            <div class="avatar" title="${m.nombre}">${inicial}</div>
          </div>

          <div class="hero">
            <div class="hero-content">
              <div class="greeting">¡Hola <b>${firstName}</b> 👋</div>
              <div class="card-numbers"><span class="big-n">${m.sellos_actuales || 0}</span><span class="of-n">/ 20 sellos</span></div>
              <div class="sellos-grid">${sellosHTML}</div>
              <div class="card-meta">
                <span>${m.canje_disponible ? '🎉 ¡Canje disponible!' : `Faltan ${restantes} para tu canje`}</span>
                <span class="id">${idCorto}</span>
              </div>
            </div>
          </div>

          <div class="section-title"><h2>Nuestros negocios</h2></div>
          <div class="negocios">
            <div class="negocio-card"><img src="/assets/logo-plaza.svg" alt="Plaza"/></div>
            <div class="negocio-card"><img src="/assets/logo-taqueria.svg" alt="Taquería"/></div>
            <div class="negocio-card"><img src="/assets/logo-alpadel.svg" alt="Alpadel"/></div>
            <div class="negocio-card"><img src="/assets/logo-bebros.svg" alt="Bebros"/></div>
            <div class="negocio-card"><img src="/assets/logo-nube.svg" alt="Nube"/></div>
          </div>

          <div class="section-title"><h2>Menú completo</h2></div>
          <div class="menu-completo-wrap">
            <div class="menu-completo-card">
              <div class="menu-completo-hero">
                <div class="menu-completo-info">
                  <div>
                    <h3>Menú Grupo Cotorreo</h3>
                    <div class="sub">2 páginas · 80+ platos</div>
                  </div>
                  <div class="btn">Ver todo</div>
                </div>
              </div>
              <div class="menu-completo-pages">
                <div class="menu-page" style="background-image:url(/assets/menu-p1.jpg)"></div>
                <div class="menu-page" style="background-image:url(/assets/menu-p2.jpg)"></div>
              </div>
            </div>
          </div>

          <div class="section-title"><h2>Populares esta semana</h2></div>
          <div class="menu-scroll">${platosHTML}</div>

          <div class="section-title"><h2>Tu progreso</h2></div>
          ${canjeCard}

          <div class="section-title"><h2>Última actividad</h2></div>
          <div class="activity">${activityHTML}</div>

          <div class="bottom-nav">
            <div class="nav-item active">
              <svg viewBox="0 0 24 24"><path d="M12 2L2 9v13h6v-7h8v7h6V9L12 2z"/></svg>
              Inicio
            </div>
            <div class="nav-item">
              <svg viewBox="0 0 24 24"><path d="M8.1 13.34l2.83-2.83L3.91 3.5c-1.56 1.56-1.56 4.09 0 5.66l4.19 4.18zm6.78-1.81c1.53.71 3.68.21 5.27-1.38 1.91-1.91 2.28-4.65.81-6.12-1.46-1.46-4.20-1.10-6.12.81-1.59 1.59-2.09 3.74-1.38 5.27L3.7 19.87l1.41 1.41L12 14.41l6.88 6.88 1.41-1.41L13.41 13l1.47-1.47z"/></svg>
              Menú
            </div>
            <div class="nav-item">
              <svg viewBox="0 0 24 24"><path d="M20 6h-2.18c.11-.31.18-.65.18-1 0-1.66-1.34-3-3-3-1.05 0-1.96.54-2.5 1.35l-.5.67-.5-.68C10.96 2.54 10.05 2 9 2 7.34 2 6 3.34 6 5c0 .35.07.69.18 1H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2z"/></svg>
              Canjear
            </div>
            <div class="nav-item">
              <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
              Cuenta
            </div>
          </div>
        </div>
      `;
    }

    async function pedirCanje() {
      if (!confirm("¿Canjear 20 sellos por ₡15.000 de crédito?")) return;
      try {
        const r = await api('/api/pedir-canje', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ telefono: miembro.miembro.telefono })
        });
        alert(`¡Listo! Tu código es ${r.codigo_canje}. También te lo enviamos por WhatsApp.`);
        location.reload();
      } catch (e) {
        alert("Error: " + e.message);
      }
    }

    function renderError(msg) {
      app.innerHTML = `
        <div class="center-card">
          <h2 style="color:#dc2626">Ups, algo pasó</h2>
          <p>${msg}</p>
          <button onclick="location.href='/'">Volver al inicio</button>
        </div>
      `;
    }

    init();

    // PWA service worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
